# ID procject

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "expert-poker-player"
version = "0.1.0"
description = "Ultimate Texas Hold'em reinforcement learning environment"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"